{% extends "base.html" %}

{% block titulo %}Doar Material - Mochila Cheia{% endblock %}

{% block conteudo %}
<div class="publicar-container">
    <a href="/" class="link-voltar" aria-label="Voltar para a home">← Voltar</a>
    
    <div class="publicar-header">
        <h1 class="publicar-titulo">Doar Material</h1>
        <p class="publicar-subtitulo">Preencha os dados do item que você deseja repassar.</p>
    </div>

    <form method="POST" action="/itens/publicar" class="form-publicar" enctype="multipart/form-data">

        <div class="input-group">
            <label for="foto">Foto do item (opcional)</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <div class="input-group">
            <label for="titulo">O que você está doando?</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Mochila escolar azul reforçada" required aria-required="true">
        </div>

        <div class="input-group">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required aria-required="true">
                <option value="" disabled selected>Selecione uma categoria</option>
                <option value="Mochilas">Mochilas</option>
                <option value="Livros">Livros Didáticos</option>
                <option value="Cadernos">Cadernos</option>
                <option value="Escrita">Materiais de Escrita (Lápis, Canetas)</option>
                <option value="Uniformes">Uniformes</option>
            </select>
        </div>

        <div class="input-group">
            <label for="estado">Estado de conservação</label>
            <select id="estado" name="estado" required aria-required="true">
                <option value="" disabled selected>Como está o material?</option>
                <option value="Novo">Novo (Nunca usado)</option>
                <option value="Seminovo">Seminovo (Pouquíssimo uso)</option>
                <option value="Usado">Usado (Com marcas de uso, mas funcional)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="descricao">Descrição (Detalhes importantes)</label>
            <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva detalhes como tamanho, marca, se possui alguma avaria leve, etc." required aria-required="true"></textarea>
        </div>

        <button type="submit" class="btn-primario btn-bloco mt-16">Publicar Doação</button>
    </form>
</div>
{% endblock %}
