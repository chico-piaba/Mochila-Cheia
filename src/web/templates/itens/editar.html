{% extends "base.html" %}
{% block titulo %}Editar item — Mochila Cheia{% endblock %}
{% block conteudo %}
<div class="relative flex h-auto min-h-screen w-full max-w-[480px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden pb-24">
<!-- Header -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 sticky top-0 z-10 border-b border-primary/10">
<a href="{{ url_for('itens.meus') }}" class="text-primary flex size-10 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Editar Item</h2>
</div>
<!-- Form -->
<form method="POST" action="{{ url_for('itens.editar', id_item=item.id) }}" enctype="multipart/form-data" class="flex flex-col gap-6 p-4">
<!-- Foto Section -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight">Foto do item</h3>
<div class="w-full rounded-xl min-h-[200px] shadow-sm border border-primary/10 bg-slate-200 dark:bg-slate-800 flex items-center justify-center overflow-hidden">
{% if item.foto_url and item.foto_url.startswith('/static/') %}
<img src="{{ item.foto_url }}" alt="Foto atual do item" class="w-full h-full object-cover"/>
{% else %}
<span class="material-symbols-outlined text-slate-400 text-5xl">image</span>
{% endif %}
</div>
<label class="flex items-center justify-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 rounded-full text-primary text-sm font-bold shadow-sm border border-primary/20 cursor-pointer">
<span class="material-symbols-outlined text-sm">photo_camera</span>
Trocar foto
<input type="file" name="foto" accept="image/*" class="hidden"/>
</label>
</section>
<!-- Form Fields -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="titulo">Título do item</label>
<input id="titulo" name="titulo" required value="{{ item.titulo }}" class="w-full h-12 px-4 rounded-lg border-primary/20 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="descricao">Descrição</label>
<textarea id="descricao" name="descricao" rows="4" class="w-full p-4 rounded-lg border-primary/20 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary">{{ item.descricao }}</textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="categoria">Categoria</label>
<select id="categoria" name="categoria" required class="w-full h-12 px-4 rounded-lg border-primary/20 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary">
{% for cat in categorias %}
<option value="{{ cat.nome }}" {% if cat.nome == item.categoria %}selected{% endif %}>{{ cat.nome }}</option>
{% endfor %}
</select>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="estado">Estado de conservação</label>
<select id="estado" name="estado" required class="w-full h-12 px-4 rounded-lg border-primary/20 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary">
{% for e in estados %}
<option value="{{ e }}" {% if e == item.estado %}selected{% endif %}>{{ e }}</option>
{% endfor %}
</select>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pt-2">
<button type="submit" class="w-full h-12 bg-primary text-white rounded-xl font-bold shadow-lg shadow-primary/20 flex items-center justify-center">
Salvar Alterações
</button>
<a href="{{ url_for('itens.meus') }}" class="w-full h-12 bg-transparent text-slate-600 dark:text-slate-400 rounded-xl font-bold flex items-center justify-center border border-slate-200 dark:border-slate-800">
Cancelar
</a>
</div>
</form>
</div>
{% endblock %}
