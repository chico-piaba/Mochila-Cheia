{% extends "base.html" %}

{% block titulo %}Criar Conta - Mochila Cheia{% endblock %}

{% block conteudo %}
<div class="auth-container">
    <div class="auth-header">
        <h2 class="auth-titulo">Criar Conta</h2>
        <p class="auth-subtitulo">Junte-se à rede de solidariedade para materiais escolares.</p>
    </div>

    <form method="POST" action="/auth/cadastro" class="auth-form">
        <div class="input-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required aria-required="true">
        </div>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required aria-required="true">
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required aria-required="true">
            <small class="dica-senha">Dica: Use pelo menos 8 caracteres com letras e números.</small>
        </div>

        <div class="tipo-usuario-group">
            <p class="label-tipo">Tipo de usuário</p>
            <div class="radio-cards">
                <input type="radio" id="doador" name="tipo_usuario" value="doador" required>
                <label for="doador" class="radio-card">
                    <span class="icone">🤝</span>
                    Quero Doar
                </label>

                <input type="radio" id="receptor" name="tipo_usuario" value="receptor">
                <label for="receptor" class="radio-card">
                    <span class="icone">🎒</span>
                    Preciso de Materiais
                </label>
            </div>
        </div>

        <button type="submit" class="btn-primario btn-bloco">Cadastrar</button>
    </form>

    <div class="auth-footer">
        <p>Já tenho conta? <a href="/auth/login" class="link-destaque">Entrar</a></p>
    </div>
</div>
{% endblock %}
