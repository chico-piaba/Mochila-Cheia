name: Esteira de Integracao Continua (CI/CD)

# QUANDO o pipeline roda: a cada push e a cada pull request na branch main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Permissões do GITHUB_TOKEN: ler o código e publicar a imagem no GHCR
permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  # ----------------------------------------------------------------- CI ---
  build-and-test:
    runs-on: ubuntu-latest  # a máquina virtual (Runner) que o GitHub empresta

    steps:
      - name: 1. Baixar o codigo fonte (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 4. Validacao estatica (Lint com Flake8)
        run: |
          # Primeiro os erros que quebram o Python (sintaxe, nome indefinido)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Depois o estilo completo (regras no arquivo .flake8)
          flake8 . --count --statistics

      - name: 5. Testes automatizados (Pytest)
        run: pytest -v

      - name: 6. Construir a imagem Docker
        run: docker build -t mochila-cheia:${{ github.sha }} .

      - name: 7. Teste de fumaca no conteiner
        run: |
          docker run -d -p 5000:5000 --name mochila mochila-cheia:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/api/saude && exit 0
            sleep 1
          done
          docker logs mochila
          exit 1

  # ----------------------------------------------------------------- CD ---
  # Só roda em push na main, e só se o job de CI passou inteiro
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte (Checkout)
        uses: actions/checkout@v4

      - name: 2. Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Publicar a imagem (latest + sha do commit)
        run: |
          IMAGEM=$(echo "$IMAGEM" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGEM:latest" -t "$IMAGEM:${{ github.sha }}" .
          docker push --all-tags "$IMAGEM"
